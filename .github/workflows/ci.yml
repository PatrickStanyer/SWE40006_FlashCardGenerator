name: CI

# PR gate: every pull request to main must pass ALL jobs below before merge.
# (Enforce via Settings > Branches > Branch protection > "Require status checks".)
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (ESLint, zero warnings)
        run: npm run lint
      - name: Unit tests + coverage gate (>=80% lines)
        run: npm run test:coverage
      - name: Production build
        run: npm run build
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          if-no-files-found: ignore

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (Ruff)
        run: ruff check .
      - name: Unit + integration tests with coverage gate (>=80%)
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80
        env:
          AI_MOCK_MODE: "true"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  security-scan:
    name: Security (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan dependencies and config (filesystem)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Build frontend image
        run: docker build -t flashcard-frontend:ci ./frontend
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: flashcard-frontend:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Build backend image
        run: docker build -t flashcard-backend:ci ./backend
      - name: Scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: flashcard-backend:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
