name: CI

# PR gate: every pull request must pass ALL jobs below before merge.
# (Enforce via Settings > Branches > Branch protection > "Require status checks".)
#
# No branch filter. Restricting this to pull requests targeting main meant a
# pull request aimed at any other branch reported no checks at all, so work
# stacked on a branch went through unverified.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # nginx only reads its configuration when a container starts, so a typo
      # here surfaces in the middle of a deployment rather than in a pull
      # request. Loading the file into the image the frontend actually ships
      # is the cheapest place to find that out.
      - name: Validate nginx configuration
        run: >-
          docker run --rm
          -v "$PWD/nginx.conf:/etc/nginx/conf.d/default.conf:ro"
          nginxinc/nginx-unprivileged:1.27-alpine nginx -t

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (ESLint, zero warnings)
        run: npm run lint
      - name: Unit tests + coverage gate (>=80% lines)
        run: npm run test:coverage
      - name: Production build
        run: npm run build
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          if-no-files-found: ignore

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # The service is still landing. Until backend/requirements.txt exists the
      # job succeeds with nothing to do, so the required "Backend" check can be
      # satisfied either way and no pull request is blocked on ordering.
      #
      # hashFiles cannot express this. It is unavailable in a job-level if, and
      # putting it there makes GitHub reject the whole workflow, which is what
      # stopped every run from starting until now. A step output works and is
      # checked at the right time.
      - name: Detect backend service
        id: detect
        run: |
          if [ -f requirements.txt ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No backend/requirements.txt on this ref yet, nothing to check."
          fi

      - uses: actions/setup-python@v5
        if: steps.detect.outputs.present == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        if: steps.detect.outputs.present == 'true'
        run: pip install -r requirements-dev.txt
      - name: Lint (Ruff)
        if: steps.detect.outputs.present == 'true'
        run: ruff check .
      - name: Unit + integration tests with coverage gate (>=80%)
        if: steps.detect.outputs.present == 'true'
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80
        env:
          AI_MOCK_MODE: "true"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  security-scan:
    name: Security (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan dependencies and config (filesystem)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Build frontend image
        run: docker build -t flashcard-frontend:ci ./frontend
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: flashcard-frontend:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      # Same reasoning as the Backend job: the service is still landing, and on
      # a ref without backend/Dockerfile there is no image to build or scan.
      - name: Detect backend image
        id: detect
        run: |
          if [ -f backend/Dockerfile ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No backend/Dockerfile on this ref yet, skipping the backend image scan."
          fi
      - name: Build backend image
        if: steps.detect.outputs.present == 'true'
        run: docker build -t flashcard-backend:ci ./backend
      - name: Scan backend image
        if: steps.detect.outputs.present == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: flashcard-backend:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
