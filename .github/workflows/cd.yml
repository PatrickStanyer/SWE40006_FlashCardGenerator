name: CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/patrickstanyer/flashcard

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Generate image tag
        id: tag
        run: echo "tag=sha-$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            -t $IMAGE_NAME:${{ steps.tag.outputs.tag }} \
            ./frontend

      - name: Push image
        run: |
          docker push $IMAGE_NAME:${{ steps.tag.outputs.tag }}

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ghcr.io/patrickstanyer/flashcard:${{ needs.build.outputs.image_tag }}
      - name: Smoke Test
        run: |
          curl -f http://${{ secrets.EC2_HOST }}:8080/

  deploy-production:
     needs:
       - build
       - deploy-staging

     runs-on: ubuntu-latest

     environment:
       name: production

     steps:
       - name: Deploy Production
         uses: appleboy/ssh-action@v1.0.3
         with:
           host: ${{ secrets.EC2_HOST }}
           username: ${{ secrets.EC2_USER }}
           key: ${{ secrets.EC2_SSH_KEY }}
           script: |
             docker pull ghcr.io/patrickstanyer/flashcard:${{ needs.build.outputs.image_tag }}

             docker stop flashcard-prod || true
             docker rm flashcard-prod || true

             docker run -d \
               --name flashcard-prod \
               -p 80:80 \
               ghcr.io/patrickstanyer/flashcard:${{ needs.build.outputs.image_tag }}
