name: CD

# Runs on every push to main. Branch protection already requires the three CI
# checks to pass before anything can reach main, so a commit arriving here has
# been linted, tested and scanned.
on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  FRONTEND_IMAGE: ghcr.io/patrickstanyer/flashcard
  BACKEND_IMAGE: ghcr.io/patrickstanyer/flashcard-backend

jobs:
  build:
    name: Build and publish images
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      # Both images carry the same commit-derived tag, so a deployment can
      # always be traced back to the exact commit that produced it.
      - name: Generate image tag
        id: tag
        run: echo "tag=sha-$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL" \
            || { echo "Repository variable VITE_SUPABASE_URL is required to build the frontend."; exit 1; }
          test -n "$VITE_SUPABASE_ANON_KEY" \
            || { echo "Repository variable VITE_SUPABASE_ANON_KEY is required to build the frontend."; exit 1; }
          docker build \
            --build-arg VITE_SUPABASE_URL="$VITE_SUPABASE_URL" \
            --build-arg VITE_SUPABASE_ANON_KEY="$VITE_SUPABASE_ANON_KEY" \
            -t "$FRONTEND_IMAGE:${{ steps.tag.outputs.tag }}" \
            ./frontend
          docker push "$FRONTEND_IMAGE:${{ steps.tag.outputs.tag }}"

      - name: Build and push backend image
        run: |
          docker build -t "$BACKEND_IMAGE:${{ steps.tag.outputs.tag }}" ./backend
          docker push "$BACKEND_IMAGE:${{ steps.tag.outputs.tag }}"

  deploy-staging:
    name: Deploy to staging
    needs: build
    runs-on: ubuntu-latest

    # No url here. jobs.<id>.environment.url does not allow the secrets
    # context, and one disallowed expression makes GitHub reject the whole
    # workflow, which is why this file ran with zero jobs.
    environment:
      name: staging

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          TAG: ${{ needs.build.outputs.image_tag }}
          FRONTEND_IMAGE: ${{ env.FRONTEND_IMAGE }}
          BACKEND_IMAGE: ${{ env.BACKEND_IMAGE }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Not secrets. Setting these points the same client at any
          # OpenAI-compatible provider; empty means OpenAI itself.
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: TAG,FRONTEND_IMAGE,BACKEND_IMAGE,OPENAI_API_KEY,OPENAI_BASE_URL,OPENAI_MODEL
          script: |
            set -eu

            docker pull "$BACKEND_IMAGE:$TAG"
            docker pull "$FRONTEND_IMAGE:$TAG"

            # Prove the log driver works before anything is torn down. The
            # awslogs driver fails the whole docker run when it cannot reach
            # CloudWatch, and the teardown below happens before the containers
            # are recreated, so an unusable driver would leave this environment
            # with nothing running rather than simply failing the deployment.
            # This throwaway container exits immediately and, under set -e,
            # aborts the job while the previous stack is still serving.
            echo "Checking the CloudWatch log driver before replacing anything."
            docker run --rm \
              --log-driver=awslogs \
              --log-opt awslogs-region=ap-southeast-2 \
              --log-opt awslogs-group=/flashcard/staging \
              --log-opt awslogs-create-group=true \
              --log-opt awslogs-stream=preflight-$TAG \
              "$BACKEND_IMAGE:$TAG" \
              python -c "print('cloudwatch log driver reachable')"

            # Staging and production each get their own bridge network, so the
            # two environments cannot reach one another's containers.
            docker network create flashcard-staging 2>/dev/null || true

            # Replace rather than leave running. Pulling an image on its own
            # changes nothing, which is why staging used to keep serving an old
            # build after a successful deployment.
            docker rm -f flashcard-staging-api flashcard-staging-web 2>/dev/null || true

            # Containers started by hand earlier in the project still hold the
            # published port under names this job does not know, so match on the
            # port itself rather than guessing. Without this the web tier fails
            # with "port is already allocated" after everything else succeeded.
            for cid in $(docker ps -q --filter "publish=8080"); do
              echo "Removing container $cid which still holds port 8080"
              docker rm -f "$cid" || true
            done

            # The network alias has to be "api": frontend/nginx.conf proxies
            # /api and /healthz to http://api:8000 over this network.
            docker run -d \
              --name flashcard-staging-api \
              --network flashcard-staging \
              --network-alias api \
              --restart unless-stopped \
              --log-driver=awslogs \
              --log-opt awslogs-region=ap-southeast-2 \
              --log-opt awslogs-group=/flashcard/staging \
              --log-opt awslogs-create-group=true \
              --log-opt awslogs-stream=api-$TAG \
              -e APP_VERSION="$TAG" \
              -e AI_MOCK_MODE=false \
              -e OPENAI_API_KEY="${OPENAI_API_KEY:-}" \
              -e OPENAI_BASE_URL="${OPENAI_BASE_URL:-}" \
              -e OPENAI_MODEL="${OPENAI_MODEL:-}" \
              "$BACKEND_IMAGE:$TAG"

            # Only the web tier is published. The backend is reachable through
            # nginx and nowhere else. An unprivileged nginx listens on 8080.
            docker run -d \
              --name flashcard-staging-web \
              --network flashcard-staging \
              --restart unless-stopped \
              --log-driver=awslogs \
              --log-opt awslogs-region=ap-southeast-2 \
              --log-opt awslogs-group=/flashcard/staging \
              --log-opt awslogs-create-group=true \
              --log-opt awslogs-stream=web-$TAG \
              -p 8080:8080 \
              "$FRONTEND_IMAGE:$TAG"

            docker image prune -f

      # Verifies the deployment rather than the server merely being up. The
      # version check is the important one: it fails if an older container is
      # still answering, which a plain reachability check would not catch.
      - name: Smoke test staging
        env:
          BASE: http://${{ secrets.EC2_HOST }}:8080
          TAG: ${{ needs.build.outputs.image_tag }}
          # Only to decide which generator this environment should be using.
          # The value is never printed.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -eu
          curl -fsS --retry 12 --retry-delay 5 --retry-all-errors "$BASE/" > /dev/null
          echo "Page served."

          HEALTH=$(curl -fsS --retry 12 --retry-delay 5 --retry-all-errors "$BASE/healthz")
          echo "Health: $HEALTH"
          echo "$HEALTH" | grep -q "$TAG" \
            || { echo "Deployed version is not $TAG. An older container is still serving."; exit 1; }

          CARDS=$(curl -fsS -X POST "$BASE/api/generate" \
            -H 'Content-Type: application/json' \
            -d '{"topic":"deployment smoke test","count":2}')
          echo "$CARDS" | grep -q '"front"' \
            || { echo "Card generation did not return cards."; exit 1; }
          echo "Card generation reachable through the proxy."

          # A rejected credential still returns 200 with a full deck, because
          # generation falls back to the deterministic generator. Without this
          # the pipeline cannot tell a working key from a broken one.
          if [ -n "${OPENAI_API_KEY:-}" ]; then
            EXPECTED=model
          else
            EXPECTED=deterministic
          fi
          echo "$CARDS" | grep -q "\"source\":[[:space:]]*\"$EXPECTED\"" \
            || { echo "This environment is configured for the $EXPECTED generator, but the deck did not come from it. A live call is failing and falling back silently."; exit 1; }
          echo "Deck came from the $EXPECTED generator, as configured."

      # Browser-level check of the core user journey on the live Staging stack:
      # generate a deck, flip a card, navigate. The curl checks above prove the
      # services answer; this proves a user can actually use the app. Because
      # deploy-production needs this job, a failure here blocks the release.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: e2e

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: E2E smoke test staging (Playwright)
        working-directory: e2e
        env:
          BASE_URL: http://${{ secrets.EC2_HOST }}:8080
          EXPECTED_VERSION: ${{ needs.build.outputs.image_tag }}
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-staging
          path: e2e/playwright-report
          retention-days: 14
          if-no-files-found: ignore

  deploy-production:
    name: Deploy to production
    needs:
      - build
      - deploy-staging

    runs-on: ubuntu-latest

    # The only manual step in the pipeline. Required reviewers on this
    # environment hold the release until someone approves it.
    environment:
      name: production

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          TAG: ${{ needs.build.outputs.image_tag }}
          FRONTEND_IMAGE: ${{ env.FRONTEND_IMAGE }}
          BACKEND_IMAGE: ${{ env.BACKEND_IMAGE }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Not secrets. Setting these points the same client at any
          # OpenAI-compatible provider; empty means OpenAI itself.
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: TAG,FRONTEND_IMAGE,BACKEND_IMAGE,OPENAI_API_KEY,OPENAI_BASE_URL,OPENAI_MODEL
          script: |
            set -eu

            docker pull "$BACKEND_IMAGE:$TAG"
            docker pull "$FRONTEND_IMAGE:$TAG"

            # Prove the log driver works before anything is torn down. The
            # teardown below happens before the containers are recreated, so a
            # driver that cannot reach CloudWatch would leave production with
            # nothing serving rather than simply failing the deployment. This
            # throwaway container exits immediately and, under set -e, aborts
            # the job while the previous stack is still up.
            echo "Checking the CloudWatch log driver before replacing anything."
            docker run --rm \
              --log-driver=awslogs \
              --log-opt awslogs-region=ap-southeast-2 \
              --log-opt awslogs-group=/flashcard/production \
              --log-opt awslogs-create-group=true \
              --log-opt awslogs-stream=preflight-$TAG \
              "$BACKEND_IMAGE:$TAG" \
              python -c "print('cloudwatch log driver reachable')"

            docker network create flashcard-production 2>/dev/null || true

            # flashcard-prod is the container name the earlier single-container
            # deployment used; removing it keeps port 80 free.
            docker rm -f flashcard-prod flashcard-production-api flashcard-production-web 2>/dev/null || true

            for cid in $(docker ps -q --filter "publish=80"); do
              echo "Removing container $cid which still holds port 80"
              docker rm -f "$cid" || true
            done

            docker run -d \
              --name flashcard-production-api \
              --network flashcard-production \
              --network-alias api \
              --restart unless-stopped \
              --log-driver=awslogs \
              --log-opt awslogs-region=ap-southeast-2 \
              --log-opt awslogs-group=/flashcard/production \
              --log-opt awslogs-create-group=true \
              --log-opt awslogs-stream=api-$TAG \
              -e APP_VERSION="$TAG" \
              -e AI_MOCK_MODE=false \
              -e OPENAI_API_KEY="${OPENAI_API_KEY:-}" \
              -e OPENAI_BASE_URL="${OPENAI_BASE_URL:-}" \
              -e OPENAI_MODEL="${OPENAI_MODEL:-}" \
              "$BACKEND_IMAGE:$TAG"

            docker run -d \
              --name flashcard-production-web \
              --network flashcard-production \
              --restart unless-stopped \
              --log-driver=awslogs \
              --log-opt awslogs-region=ap-southeast-2 \
              --log-opt awslogs-group=/flashcard/production \
              --log-opt awslogs-create-group=true \
              --log-opt awslogs-stream=web-$TAG \
              -p 80:8080 \
              "$FRONTEND_IMAGE:$TAG"

            docker image prune -f

      - name: Smoke test production
        env:
          BASE: http://${{ secrets.EC2_HOST }}
          TAG: ${{ needs.build.outputs.image_tag }}
          # Only to decide which generator this environment should be using.
          # The value is never printed.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -eu
          curl -fsS --retry 12 --retry-delay 5 --retry-all-errors "$BASE/" > /dev/null
          echo "Page served."

          HEALTH=$(curl -fsS --retry 12 --retry-delay 5 --retry-all-errors "$BASE/healthz")
          echo "Health: $HEALTH"
          echo "$HEALTH" | grep -q "$TAG" \
            || { echo "Deployed version is not $TAG. An older container is still serving."; exit 1; }

          CARDS=$(curl -fsS -X POST "$BASE/api/generate" \
            -H 'Content-Type: application/json' \
            -d '{"topic":"deployment smoke test","count":2}')
          echo "$CARDS" | grep -q '"front"' \
            || { echo "Card generation did not return cards."; exit 1; }
          echo "Card generation reachable through the proxy."

          # A rejected credential still returns 200 with a full deck, because
          # generation falls back to the deterministic generator. Without this
          # the pipeline cannot tell a working key from a broken one.
          if [ -n "${OPENAI_API_KEY:-}" ]; then
            EXPECTED=model
          else
            EXPECTED=deterministic
          fi
          echo "$CARDS" | grep -q "\"source\":[[:space:]]*\"$EXPECTED\"" \
            || { echo "This environment is configured for the $EXPECTED generator, but the deck did not come from it. A live call is failing and falling back silently."; exit 1; }
          echo "Deck came from the $EXPECTED generator, as configured."
