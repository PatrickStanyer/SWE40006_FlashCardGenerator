# Loads every dashboard JSON in the mounted folder, so the board is part of
# the repository rather than something someone has to rebuild by hand.
apiVersion: 1

providers:
  - name: flashcard
    type: file
    disableDeletion: true
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
